name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # The world generator and its tools, on every platform. The golden hashes
  # must be identical on all of them.
  core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # x86_64 Linux, ARM64 Linux, ARM64 macOS, x86_64 Windows.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      # Debug and release: the world must not depend on the optimiser either.
      - run: cargo test -p backrooms-core -p backrooms-cli
      - run: cargo test -p backrooms-core -p backrooms-cli --release

  # The game is built once, on Linux: compiling the engine is slow, and its
  # tests are plain logic that does not differ between platforms.
  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable && rustup component add rustfmt clippy
      - name: Install the libraries Bevy links against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -p backrooms-game
